# Guarda tu pagina de Weebly en la Wayback Machine (archive.org) automaticamente.
#   - Cada domingo:  inicio + paginas p1..p80   (lo de la seccion [semanal] de wayback/paginas.txt)
#   - El dia 1 de cada mes:  todo (mapas, skins, texture packs y perfiles)
#   - Cuando quieras a mano:  pestana Actions -> "Guardar en Wayback Machine" -> Run workflow
# Los resultados se ven en la pestana Actions, dentro de cada corrida.
name: Guardar en Wayback Machine

on:
  schedule:
    - cron: '17 9 * * 0'      # domingos, 09:17 UTC (03:17 en Mexico)
    - cron: '43 9 1 * *'      # dia 1 de cada mes, 09:43 UTC
  workflow_dispatch:
    inputs:
      modo:
        description: 'Que guardar'
        type: choice
        default: semanal
        options:
          - semanal
          - mensual

concurrency:
  group: wayback
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guardar:
    # el trabajo se reparte entre 3 robots que corren al mismo tiempo (asi termina en ~2 horas en vez de ~6)
    name: Guardar (parte ${{ matrix.parte }})
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        parte: ['1/3', '2/3', '3/3']
    steps:
      - uses: actions/checkout@v4
      - name: Guardar paginas
        env:
          MODO: ${{ github.event_name == 'workflow_dispatch' && inputs.modo || (github.event.schedule == '43 9 1 * *' && 'mensual' || 'semanal') }}
        run: python3 wayback/guardar.py --modo "$MODO" --parte "${{ matrix.parte }}"
